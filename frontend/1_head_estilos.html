<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de PQRS · MiRed IPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@700;800;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ===========================================================================
   TIPOGRAFÍA INSTITUCIONAL
   Volkswagen Serial (cuerpo) y Volkswagen Serial Black (títulos) son fuentes con
   licencia: ningún CDN público las sirve. Si los equipos las tienen instaladas se
   usan solas (van primero en la pila). Si tienes los .woff2, descomenta y pega la URL:

   @font-face{font-family:"VW Serial";src:url("URL_REGULAR.woff2") format("woff2");font-weight:400 700;font-display:swap}
   @font-face{font-family:"VW Serial Black";src:url("URL_BLACK.woff2") format("woff2");font-weight:900;font-display:swap}

   Respaldo: Barlow / Barlow Semi Condensed, las grotescas libres más cercanas.
   =========================================================================== */
:root{
  --ground:#F2F5F7; --surface:#FFFFFF; --surface-2:#F7F9FA; --surface-3:#EBF0F3;
  --ink:#10222C; --ink-2:#465C68; --ink-3:#7F939E;
  --line:#E1E8EC; --line-2:#CBD8DE;
  /* Paleta del logo MiRed */
  --teal:#006081; --teal-2:#0F7FA6; --teal-dark:#00475F; --teal-wash:#E4F0F5; --teal-wash-2:#F0F7FA;
  --rojo:#E20A31; --amarillo:#FEDC00; --verde:#009C4D;
  /* Estados (reservados al semáforo) */
  --ok:#1C6B44; --ok-wash:#DDF0E5; --warn:#8E5B00; --warn-wash:#FBEFD6;
  --bad:#AB1130; --bad-wash:#FBE1E6; --star:#5B3E97; --star-wash:#ECE6F7;
  /* Tipos de PQRS (derivados del logo, validados para daltonismo en este orden) */
  --t-queja:#E20A31; --t-peticion:#006D93; --t-sugerencia:#00985A; --t-felicitacion:#8455B8;
  --t-reclamo:#B98A00; --t-tutela:#3D5FA8; --t-denuncia:#B4531A;
  --r-sm:9px; --r:14px; --r-lg:18px;
  --sh-1:0 1px 1px rgba(16,42,56,.04),0 2px 6px rgba(16,42,56,.05);
  --sh-2:0 1px 2px rgba(16,42,56,.05),0 8px 22px rgba(16,42,56,.08);
  --sh-3:0 18px 50px rgba(10,32,44,.22),0 4px 12px rgba(10,32,44,.10);
  --sans:"VW Serial","Volkswagen Serial","Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --display:"VW Serial Black","Volkswagen Serial Black","Barlow Semi Condensed","Barlow",var(--sans);
  --mono:"SF Mono",Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
html{overflow-x:hidden}body{overflow-x:clip}   /* v7.1: overflow en body rompía la barra fija */
body{background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:clamp(13.5px,.9vw,15px);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.display{font-family:var(--display);font-weight:800;letter-spacing:-.01em;margin:0}
a{color:var(--teal)}
img{max-width:100%}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:15px;height:15px}.ic.l{width:22px;height:22px}
.num{font-variant-numeric:tabular-nums}

/* ---------- barra de progreso global y animaciones ---------- */
#carga{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .2s}
#carga.on{opacity:1}
#carga::before{content:"";position:absolute;inset:0 auto 0 0;width:40%;
  background:linear-gradient(90deg,transparent,var(--teal-2),var(--teal),transparent);animation:barrido 1.1s var(--ease) infinite}
@keyframes barrido{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@keyframes subir{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes brillo{from{background-position:-320px 0}to{background-position:320px 0}}
@keyframes entraToast{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes consumir{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(226,10,49,.45)}70%{box-shadow:0 0 0 8px rgba(226,10,49,0)}100%{box-shadow:0 0 0 0 rgba(226,10,49,0)}}
.anim{animation:subir .38s var(--ease) both}
.anim-lista > *{animation:subir .38s var(--ease) both}
.anim-lista > *:nth-child(2){animation-delay:.03s}.anim-lista > *:nth-child(3){animation-delay:.06s}
.anim-lista > *:nth-child(4){animation-delay:.09s}.anim-lista > *:nth-child(5){animation-delay:.12s}
.anim-lista > *:nth-child(6){animation-delay:.15s}.anim-lista > *:nth-child(7){animation-delay:.18s}
.anim-lista > *:nth-child(8){animation-delay:.21s}.anim-lista > *:nth-child(n+9){animation-delay:.24s}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;
  display:inline-block;animation:girar .7s linear infinite;vertical-align:-3px;flex:none}
.sk{background:linear-gradient(90deg,var(--surface-3) 0,#F6F9FA 40%,var(--surface-3) 80%);background-size:640px 100%;
  animation:brillo 1.25s linear infinite;border-radius:10px}
.sk-lista{display:grid;gap:9px}
.sk-fila{height:66px}
.sk-tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:18px}
.sk-tarjetas .sk{height:104px}
.sk-bloque{height:230px;margin-top:12px}

/* ---------- estructura de aplicación: barra lateral + barra superior ---------- */
body{background:#EDF2F5}
.app{display:block;min-height:100vh;padding-left:256px}
.lateral{position:fixed;left:0;top:0;bottom:0;width:256px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;padding:16px 14px;
  background:linear-gradient(185deg,#004B64 0%,#00384B 60%,#002E3E 100%);color:#fff;z-index:50;overflow:auto;scrollbar-width:thin}
.lat-marca{background:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.lat-marca img{height:30px}
.lat-marca .marca{border-left:1px solid var(--line);padding-left:10px;font-size:13px;color:var(--teal-dark,#004B64)}
.lat-marca .marca small{display:block;color:var(--muted,#5B6B75);margin-top:2px}
.lat-marca .marca small{font-size:10.5px}
#menu{display:flex;flex-direction:column;gap:2px;padding:0;margin:0;overflow:visible;width:auto;max-width:none}
#menu .grupo{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);margin:12px 10px 4px;font-weight:700}
#menu button{position:relative;border:0;background:transparent;color:rgba(255,255,255,.78);font-family:var(--sans);font-weight:600;font-size:13.5px;
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;cursor:pointer;text-align:left;width:100%;transition:background .15s,color .15s;box-shadow:none}
#menu button .ic{width:18px;height:18px}
#menu button:hover{background:rgba(255,255,255,.08);color:#fff}
#menu button.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
#menu button.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--amarillo)}
#menu .badge{margin-left:auto}
.lat-usuario{margin-top:auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.07)}
.lat-usuario b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lat-usuario div span{display:block;font-size:11px;color:rgba(255,255,255,.65);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;
  background:linear-gradient(135deg,#FEDC00,#F2B600);color:#3D2E00;flex:none}
.lat-usuario .avatar{display:grid;color:#3D2E00}
@media (min-width:901px){.cab-vista h2.vista{display:none}}
.tb.urg th,.tb.urg td{padding-left:7px;padding-right:7px}.tb.urg td.dos-l{max-width:210px}.tb.urg td.mono{white-space:nowrap;font-size:12px}
.principal{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.franja{display:flex;height:3px}
.franja i{display:block;height:100%}
.franja i:nth-child(1){flex:7;background:var(--teal)}.franja i:nth-child(2){flex:1;background:var(--rojo)}
.franja i:nth-child(3){flex:1;background:var(--amarillo)}.franja i:nth-child(4){flex:1;background:var(--verde)}
.top-in{display:flex;align-items:center;gap:14px;padding:10px clamp(14px,2vw,28px);min-height:62px}
.titulo-vista{min-width:0}
.titulo-vista h1{font-size:clamp(17px,1.5vw,21px);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titulo-vista span{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buscar-global{position:relative;margin-left:auto;width:min(320px,34vw)}
.buscar-global .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.buscar-global input{padding-left:36px;border-radius:99px;background:var(--surface-2);border-color:var(--line)}
.top-der{display:flex;align-items:center;gap:8px}
.sedes-chip{font-size:11.5px;font-weight:700;color:var(--teal-dark);background:var(--teal-wash);border-radius:99px;padding:6px 11px;white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.campana{position:relative;border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;color:var(--ink-2);cursor:pointer;box-shadow:var(--sh-1);transition:all .15s}
.campana:hover{color:var(--teal);border-color:var(--teal-2)}
.campana.apagado{color:var(--ink-3);opacity:.7}
.campana .punto{position:absolute;top:-5px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--rojo);
  color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;animation:pulso 1.8s infinite}
.perfil{border:0;background:transparent;padding:0;cursor:pointer;border-radius:50%}
.perfil .avatar{box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line-2)}
#btnMenu{display:none}
.panel-flot{position:absolute;right:clamp(12px,2vw,28px);top:calc(100% + 6px);width:min(380px,calc(100vw - 24px));background:var(--surface);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-3);z-index:60;overflow:hidden;animation:entraToast .22s var(--ease) both}
.menu-perfil{width:min(300px,calc(100vw - 24px));padding:8px}
.menu-perfil .cab{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu-perfil .cab b{display:block;font-size:13.5px}.menu-perfil .cab span{font-size:11.5px;color:var(--ink-3)}
.menu-perfil button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:10px;border-radius:10px;font-family:var(--sans);
  font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;text-align:left}
.menu-perfil button:hover{background:var(--surface-2);color:var(--teal-dark)}
.menu-perfil button.peligro:hover{background:var(--bad-wash);color:var(--bad)}
.tabbar{display:none}
.velo-lat{display:none}
main{width:100%;max-width:1560px;margin:0 auto;padding:clamp(16px,2vw,26px) clamp(14px,2vw,28px) 90px}

/* ---------- acceso ---------- */
.acceso{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:#fff}
.acceso-marca{position:relative;overflow:hidden;padding:clamp(28px,5vw,64px);color:#fff;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(1200px 500px at -10% -10%,#0F7FA6 0%,transparent 60%),linear-gradient(160deg,#00566F 0%,#003447 100%)}
.acceso-marca::after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;border:60px solid rgba(255,255,255,.05)}
.acceso-logo{background:#fff;border-radius:18px;padding:14px 18px;display:inline-flex;align-self:flex-start;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.acceso-logo img{height:40px}
.acceso-marca h1{font-size:clamp(28px,3.2vw,44px);line-height:1.08;margin:28px 0 12px;color:#fff}
.acceso-marca p{max-width:520px;font-size:15px;opacity:.88;margin:0 0 26px;line-height:1.6}
.canales{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:540px}
.canal{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;font-size:13px;font-weight:600}
.canal .ic{color:var(--amarillo)}
.acceso-pie{font-size:11.5px;opacity:.6;margin-top:24px}
.acceso-form{display:grid;place-items:center;padding:clamp(24px,5vw,60px);background:#F6F9FA}
.form-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(22px,3vw,34px);box-shadow:var(--sh-3)}
.form-card h2{font-size:22px;margin-bottom:4px}
.form-card .sub{margin:0 0 20px}
.form-card label{margin-top:14px}
.form-card .b.pri{width:100%;margin-top:20px;padding:12px}
.campo-clave{position:relative}.campo-clave button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:6px}

/* ---------- usuarios ---------- */
.pasos{display:grid;gap:0;margin-top:10px}
.paso{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;position:relative;padding-bottom:14px}
.paso:not(:last-child)::before{content:"";position:absolute;left:12px;top:26px;bottom:0;width:2px;background:var(--line)}
.paso.ok:not(:last-child)::before{background:var(--teal)}
.paso i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;background:var(--surface);box-sizing:border-box}
.paso.ok i{background:var(--teal);border-color:var(--teal);color:#fff}
.paso b{display:block;font-size:13px}.paso span{display:block;font-size:12px;color:var(--ink-3)}
.enlace-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--sh-1)}
.enlace-card.mal{border-left-color:var(--bad,#C8102E);background:var(--bad-wash,#FDECEF)}
.enlace-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--teal-wash);color:var(--teal-dark)}
.enlace-card.mal .enlace-ic{background:#fff;color:var(--bad,#C8102E)}
.enlace-txt b{display:block;font-size:14px}.enlace-txt span{display:block;font-size:12px;color:var(--ink-2);margin:3px 0 6px}
.enlace-txt code{display:block;font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;overflow-wrap:anywhere;color:var(--teal-dark)}
.enlace-acc{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:640px){.enlace-card{grid-template-columns:auto minmax(0,1fr)}.enlace-acc{grid-column:1/-1}}
.usr-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.usr{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:10px;position:relative}
.usr .usr-pie{margin-top:auto}
.usr.inactivo{opacity:.6}
.usr-cab{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.usr-cab b{display:block;font-size:14px}.usr-cab div span{font-size:12px;color:var(--ink-3)}
.usr-cab .avatar{font-size:13px;color:#3D2E00}
.sedes-lista:empty{display:none}.sedes-lista{align-items:flex-start}
.rol{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:3px 9px;white-space:nowrap}
.rol.Administrador{background:#FBF1D2;color:#8A6400}.rol.Técnico{background:var(--teal-wash);color:var(--teal-dark)}.rol.Consulta{background:var(--surface-3);color:var(--ink-2)}
.sedes-lista{display:flex;flex-wrap:wrap;gap:5px}
.sedes-lista span{display:inline-block;line-height:1.5;min-height:0;height:auto;font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--ink-2)}
.usr-pie{display:flex;gap:6px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;align-items:center}
.usr-pie em{font-style:normal;font-size:11px;color:var(--ink-3);margin-right:auto}
.interruptor{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:0}
.interruptor input{position:absolute;opacity:0;width:1px;height:1px}
.interruptor i{width:38px;height:22px;border-radius:99px;background:var(--line-2);position:relative;transition:background .15s;flex:none}
.interruptor i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.interruptor input:checked + i{background:var(--teal)}
.interruptor input:checked + i::after{transform:translateX(16px)}
.chk-sedes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:4px 10px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface-2)}
.chk-sedes label{display:flex;gap:7px;align-items:center;font-weight:500;margin:0;font-size:12.5px;color:var(--ink-2)}
.chk-sedes input{width:auto;accent-color:var(--teal)}

/* ---------- prioridad, entidad y clasificador ---------- */
.prio{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:3px 7px;white-space:nowrap}
.prio.Crítica{background:#FBE1E6;color:#AB1130}.prio.Alta{background:#FFF0DB;color:#9A4F00}.prio.Media{background:var(--teal-wash);color:var(--teal-dark)}
.prio::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ent{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#3D5FA8;background:#E7ECF8;border-radius:6px;padding:3px 7px;white-space:nowrap}
.sug{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#7A4C00;background:#FFF3D6;border-radius:6px;padding:3px 7px;white-space:nowrap}
.sug.hecho{color:var(--star);background:var(--star-wash)}
.falta{display:inline-flex;font-size:11px;font-weight:700;color:var(--bad);background:var(--bad-wash);border-radius:6px;padding:3px 7px}
.fila.prio-Crítica{box-shadow:inset 0 0 0 1px rgba(171,17,48,.25),var(--sh-1)}
.banda-sug{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:linear-gradient(90deg,#FFF6DD,#FFFBEF);border:1px solid #F3DDA2;border-radius:13px;padding:12px 14px;margin-bottom:14px;font-size:13px}
.banda-sug .ic{color:#9A6B00}
.sedes-dist{display:grid;gap:8px}
.sd{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px;padding:4px 0}
.sd .nom{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd .pista{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-3)}
.sd .pista i{display:block;height:100%;animation:crecer .6s var(--ease) both;transform-origin:left}
.sd em{font-style:normal;font-size:11px;color:var(--ink-3);white-space:nowrap}
.tabla-cfg{display:grid;gap:8px}

@media(max-width:1000px){
  .app{padding-left:0}
  .lateral{position:fixed;left:0;top:0;bottom:0;width:min(290px,86vw);transform:translateX(-102%);transition:transform .25s var(--ease)}
  .lateral.abierto{transform:none;box-shadow:0 0 60px rgba(0,0,0,.35)}
  .velo-lat{position:fixed;inset:0;background:rgba(10,30,40,.4);z-index:45}
  .velo-lat.on{display:block}
  #btnMenu{display:grid}
  .buscar-global{width:auto;flex:1}
  .sedes-chip{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:44;background:rgba(255,255,255,.96);
    backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--sans);font-size:10.5px;font-weight:700;
    color:var(--ink-3);padding:6px 2px;border-radius:10px;cursor:pointer;position:relative}

  .acceso{grid-template-columns:minmax(0,1fr)}
  .acceso-marca{padding:24px}

}
@media(max-width:640px){
  .buscar-global{display:none}
  .titulo-vista span{display:none}
  .sd{grid-template-columns:minmax(0,110px) minmax(0,1fr) auto}
}
.cab-vista{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:clamp(14px,1.6vw,20px)}
h2.vista{font-size:clamp(19px,1.7vw,24px);color:var(--ink)}
p.sub{margin:4px 0 0;color:var(--ink-2);font-size:clamp(12.5px,.9vw,13.5px);max-width:760px}

/* ---------- controles ---------- */
label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.req::after{content:" *";color:var(--bad)}
input,select,textarea{width:100%;max-width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:10px;
  font-family:var(--sans);font-size:13px;background:var(--surface);color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:#AFC2CA}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,96,129,.14)}
textarea{min-height:96px;resize:vertical;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:13px}
.grid > *{min-width:0}
.full{grid-column:1/-1}
.hint{font-size:11px;color:var(--ink-3);margin-top:4px}
button.b{border:0;border-radius:10px;padding:9px 16px;font-family:var(--sans);font-weight:600;font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s,box-shadow .15s,background .15s}
button.b:active{transform:translateY(1px)}
button.b.pri{background:var(--teal);color:#fff;box-shadow:0 2px 0 var(--teal-dark),0 6px 14px rgba(0,96,129,.22)}
button.b.pri:hover{background:var(--teal-dark)}
button.b:disabled{opacity:.6;cursor:progress}
button.b.sec{background:var(--surface);color:var(--teal-dark);border:1px solid var(--line-2);box-shadow:var(--sh-1)}
button.b.sec:hover{border-color:var(--teal-2);background:var(--teal-wash-2)}
button.b.fant{background:transparent;color:var(--ink-2);padding:7px 10px}
button.b.fant:hover{background:var(--surface-3);color:var(--teal-dark)}
button.b.mini{padding:6px 11px;font-size:12px;border-radius:9px}
button.icono{border:1px solid transparent;background:transparent;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  color:var(--ink-3);cursor:pointer;transition:all .15s}
button.icono:hover{background:var(--bad-wash);color:var(--bad)}
.acciones{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(15px,1.4vw,22px);box-shadow:var(--sh-2);min-width:0}
.card-tit{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-tit h3{font-size:14.5px;display:flex;align-items:center;gap:8px}
.card-tit h3 .ic{color:var(--teal)}
.card-tit .d{font-size:11.5px;color:var(--ink-3)}
fieldset{border:0;margin:0 0 20px;padding:0;min-width:0}
legend{font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);
  padding:0 0 10px;display:flex;align-items:center;gap:10px;width:100%}
legend::after{content:"";flex:1;height:1px;background:var(--line)}

.aviso{padding:11px 14px;border-radius:11px;font-size:12.5px;margin-bottom:14px;word-break:break-word;display:flex;gap:10px;align-items:flex-start;
  animation:subir .3s var(--ease) both}
.aviso .ic{margin-top:1px}
.aviso.err{background:var(--bad-wash);color:var(--bad)}
.aviso.ok{background:var(--ok-wash);color:var(--ok)}
.aviso.info{background:var(--teal-wash);color:var(--teal-dark)}
.vacio{text-align:center;color:var(--ink-3);padding:36px 14px;font-size:13px}
.vacio .ic{width:30px;height:30px;color:var(--line-2);margin-bottom:8px}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.chip.v{background:var(--ok-wash);color:var(--ok)}.chip.a{background:var(--warn-wash);color:var(--warn)}
.chip.r{background:var(--bad-wash);color:var(--bad)}.chip.c{background:var(--surface-3);color:var(--ink-2)}
.chip.f{background:var(--star-wash);color:var(--star)}.chip.sin::before{display:none}
.tipo{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tipo i{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}

/* ---------- INICIO ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.hero-saludo{background:linear-gradient(135deg,#00475F 0%,#006081 55%,#0F7FA6 100%);color:#fff;border-radius:var(--r-lg);
  padding:clamp(18px,2vw,26px);position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(0,71,95,.28)}
.hero-saludo::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  border:28px solid rgba(255,255,255,.06)}
.hero-saludo .f{font-size:12px;opacity:.8}
.hero-saludo h2{font-size:clamp(20px,1.9vw,27px);margin:4px 0 8px;color:#fff}
.hero-saludo p{margin:0;font-size:13.5px;opacity:.92;max-width:560px;line-height:1.55}
.hero-saludo .fr{position:absolute;left:0;bottom:0;right:0;display:flex;height:4px}
.hero-saludo .fr i:nth-child(1){flex:7}.hero-saludo .fr i:nth-child(2){flex:1;background:var(--rojo)}
.hero-saludo .fr i:nth-child(3){flex:1;background:var(--amarillo)}.hero-saludo .fr i:nth-child(4){flex:1;background:var(--verde)}
.hero-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kmini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh-2);
  display:flex;flex-direction:column;gap:3px;min-width:0}
.kmini .et{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.kmini .n{font-family:var(--display);font-size:clamp(24px,2.2vw,32px);line-height:1;color:var(--teal-dark)}
.kmini .pie{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:4px}
.delta{font-weight:700;font-size:11px;display:inline-flex;align-items:center;gap:2px}
.delta.sube{color:var(--bad)}.delta.baja{color:var(--ok)}.delta.igual{color:var(--ink-3)}

.acciones-hoy{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:16px}
.accion{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 13px;cursor:pointer;text-align:left;
  font-family:var(--sans);color:inherit;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh-1);min-width:0;position:relative;overflow:hidden;
  transition:transform .16s var(--ease),box-shadow .16s,border-color .16s}
.accion::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--teal))}
.accion:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:var(--line-2)}
.accion .cab{display:flex;align-items:center;justify-content:space-between;gap:8px}
.accion .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--w,var(--teal-wash));color:var(--c,var(--teal))}
.accion .n{font-family:var(--display);font-size:clamp(24px,2.1vw,30px);line-height:1;color:var(--c,var(--teal-dark))}
.accion .t{font-size:12.5px;font-weight:700;color:var(--ink)}
.accion .d{font-size:11px;color:var(--ink-3);line-height:1.35}
.accion.cero{opacity:.62}.accion.cero .n{color:var(--ink-3)}
.acc-r{--c:var(--bad);--w:var(--bad-wash)}.acc-a{--c:var(--warn);--w:var(--warn-wash)}
.acc-v{--c:var(--ok);--w:var(--ok-wash)}.acc-t{--c:var(--teal);--w:var(--teal-wash)}

.inicio-cols{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:14px;margin-bottom:16px;align-items:start}
.pila{display:grid;gap:14px;min-width:0}
.actividad{display:grid;gap:2px}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 6px;border-radius:10px;cursor:pointer;
  border:0;background:transparent;text-align:left;font-family:var(--sans);color:inherit;width:100%}
.act:hover{background:var(--surface-2)}
.act .bola{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--teal-wash);color:var(--teal)}
.act b{display:block;font-family:var(--mono);font-size:12px;color:var(--teal-dark)}
.act span{display:block;font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act em{font-style:normal;font-size:11px;color:var(--ink-3);white-space:nowrap}
.correo-res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cr{border:1px solid var(--line);border-radius:11px;padding:10px 11px;cursor:pointer;background:var(--surface-2);text-align:left;font-family:var(--sans);color:inherit;
  transition:border-color .15s,background .15s}
.cr:hover{border-color:var(--teal-2);background:var(--teal-wash-2)}
.cr b{font-family:var(--display);font-size:20px;display:block;line-height:1.1;color:var(--teal-dark)}
.cr span{font-size:11px;color:var(--ink-2)}
.cr.alerta b{color:var(--bad)}
.nota-sis{margin-top:9px;font-size:11px;color:var(--ink-3);display:flex;gap:6px;align-items:center}

/* ---------- PANEL MENSUAL ---------- */
.panel-mes{margin-bottom:16px}
.anios{display:flex;gap:6px;flex-wrap:wrap}
.anio{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:5px 12px;font-family:var(--sans);font-size:12px;font-weight:700;
  color:var(--ink-2);cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:all .15s}
.anio small{font-weight:600;color:var(--ink-3)}
.anio:hover{border-color:var(--teal-2)}
.anio.on{background:var(--teal-dark);border-color:var(--teal-dark);color:#fff}.anio.on small{color:rgba(255,255,255,.75)}
.meses{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:11px}
.mes{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 13px 12px;cursor:pointer;text-align:left;
  font-family:var(--sans);color:inherit;display:flex;flex-direction:column;gap:7px;box-shadow:var(--sh-1);min-width:0;
  transition:transform .16s var(--ease),box-shadow .16s,border-color .16s}
.mes:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:var(--teal-2)}
.mes.actual{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal),var(--sh-2)}
.mes.futuro{opacity:.45;cursor:default;box-shadow:none}.mes.futuro:hover{transform:none;border-color:var(--line)}
.mes .cab{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mes .nm{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.mes .n{font-family:var(--display);font-size:clamp(22px,1.9vw,28px);line-height:1;color:var(--ink)}
.mes .barra{display:flex;height:7px;border-radius:99px;overflow:hidden;background:var(--surface-3);gap:1px}
.mes .barra i{display:block;height:100%}
.mes .lider{font-size:11px;color:var(--ink-2);display:flex;gap:5px;align-items:center;min-width:0}
.mes .lider span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mes .pie{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:6px}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px}

/* ---------- MODAL ---------- */
.velo{position:fixed;inset:0;background:rgba(10,30,40,.42);backdrop-filter:blur(3px);z-index:70;display:grid;place-items:center;padding:16px;
  animation:subir .2s ease both}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-3);width:min(900px,100%);max-height:min(88vh,860px);overflow:auto;
  animation:entraToast .28s var(--ease) both}
.modal-cab{position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);padding:18px 22px 14px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;gap:12px;align-items:flex-start;z-index:2}
.modal-cab h3{font-size:clamp(17px,1.6vw,21px)}
.modal-cab p{margin:3px 0 0;color:var(--ink-3);font-size:12px}
.modal-cuerpo{padding:18px 22px 22px}
.cerrar{border:0;background:var(--surface-3);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none}
.cerrar:hover{background:var(--bad-wash);color:var(--bad)}
.m-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:16px}
.m-kpis div{background:var(--surface-2);border-radius:11px;padding:10px 12px}
.m-kpis b{font-family:var(--display);font-size:22px;display:block;line-height:1.1}
.m-kpis span{font-size:11px;color:var(--ink-3)}
.lider-card{border-radius:14px;padding:16px;background:linear-gradient(135deg,var(--teal-wash) 0%,#F6FAFC 100%);border:1px solid #CFE3EB;margin-bottom:16px}
.lider-card .et{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.lider-card h4{font-size:clamp(17px,1.6vw,21px);margin:3px 0 2px;color:var(--teal-dark)}
.lider-card .res{font-size:12.5px;color:var(--ink-2);margin-bottom:12px}
.dos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.barras-h{display:grid;gap:7px}
.bh{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 34px;gap:9px;align-items:center;font-size:12px}
.bh .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bh .pista{height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bh .pista i{display:block;height:100%;border-radius:99px;transform-origin:left;animation:crecer .6s var(--ease) both}
@keyframes crecer{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bh b{text-align:right;font-variant-numeric:tabular-nums}
.bh.sel .nom{color:var(--teal-dark);font-weight:700}
button.bh{border:0;background:transparent;font-family:var(--sans);cursor:pointer;padding:3px 4px;border-radius:8px;width:100%;text-align:left}
button.bh:hover{background:var(--surface-2)}
.sub-tit{font-family:var(--display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}

/* ---------- TOASTS Y CENTRO DE NOTIFICACIONES ---------- */
#toasts{position:fixed;right:clamp(10px,2vw,22px);bottom:clamp(10px,2vw,22px);z-index:80;display:grid;gap:10px;width:min(370px,calc(100vw - 20px))}
.toast{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-3);padding:13px 14px 14px;position:relative;overflow:hidden;
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:start;animation:entraToast .32s var(--ease) both}
.toast .bola{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--teal-wash);color:var(--teal)}
.toast.correo .bola{background:#FFF8CC;color:#8A6D00}.toast.area .bola{background:var(--ok-wash);color:var(--ok)}
.toast.err .bola{background:var(--bad-wash);color:var(--bad)}
.toast b{font-size:13px;display:block}
.toast p{margin:2px 0 0;font-size:12px;color:var(--ink-2);word-break:break-word}
.toast .ir{margin-top:8px;border:0;background:transparent;color:var(--teal);font-weight:700;font-size:12px;cursor:pointer;padding:0;font-family:var(--sans);
  display:inline-flex;align-items:center;gap:4px}
.toast .x{border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:2px;border-radius:6px}
.toast .x:hover{background:var(--surface-3)}
.toast .tiempo{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--teal);transform-origin:left;animation:consumir linear forwards}
.toast.correo .tiempo{background:var(--amarillo)}.toast.area .tiempo{background:var(--verde)}.toast.err .tiempo{background:var(--rojo)}
.centro{position:absolute;right:clamp(12px,2.2vw,30px);top:calc(100% + 6px);width:min(380px,calc(100vw - 24px));background:var(--surface);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-3);z-index:60;overflow:hidden;animation:entraToast .22s var(--ease) both}
.centro-cab{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line)}
.centro-cab b{font-family:var(--display);font-size:14px}
.centro-lista{max-height:380px;overflow:auto}
.nt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:11px 15px;border-bottom:1px solid var(--surface-3);cursor:pointer;background:var(--surface);
  border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-family:var(--sans);color:inherit}
.nt:hover{background:var(--surface-2)}
.nt.nueva{background:var(--teal-wash-2)}
.nt .bola{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--teal-wash);color:var(--teal)}
.nt b{font-size:12.5px;display:block}.nt span{font-size:11.5px;color:var(--ink-2);display:block}
.nt em{font-style:normal;font-size:10.5px;color:var(--ink-3)}

/* ---------- bandeja ---------- */
.etapas{display:flex;gap:5px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding:4px;background:var(--surface-3);border-radius:13px;width:max-content;max-width:100%}
.etapas::-webkit-scrollbar{display:none}
.etapas button{border:0;background:transparent;padding:7px 13px;font-family:var(--sans);font-weight:600;font-size:12.5px;color:var(--ink-2);
  cursor:pointer;border-radius:10px;white-space:nowrap;transition:all .15s}
.etapas button:hover{color:var(--teal-dark)}
.etapas button.on{background:var(--surface);color:var(--teal-dark);box-shadow:var(--sh-1)}
.filtros{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto;gap:9px;margin-bottom:14px;align-items:end;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh-1)}
.filtros > *{min-width:0}
.buscar{position:relative}.buscar .ic{position:absolute;left:11px;bottom:10px;color:var(--ink-3)}.buscar input{padding-left:34px}
.lista{display:grid;gap:8px}
.fila{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 15px 12px 17px;position:relative;overflow:hidden;
  display:grid;grid-template-columns:minmax(0,165px) minmax(0,1fr) auto;gap:14px;align-items:center;
  cursor:pointer;text-align:left;font-family:var(--sans);color:inherit;width:100%;box-shadow:var(--sh-1);transition:transform .14s var(--ease),box-shadow .14s,border-color .14s}
.fila::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc,var(--line-2))}
.fila:hover{border-color:var(--line-2);box-shadow:var(--sh-2);transform:translateY(-1px)}
.fila .cod{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--teal-dark);word-break:break-all}
.fila .cod small{display:block;font-family:var(--sans);font-weight:500;color:var(--ink-3);font-size:11px;margin-top:3px}
.fila .med{min-width:0}
.fila .med b{font-size:13px;display:flex;gap:8px;align-items:center;margin-bottom:3px;flex-wrap:wrap}
.fila .med span{color:var(--ink-2);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .der{text-align:right;display:grid;gap:4px;justify-items:end}
.fila .der em{font-style:normal;font-size:11px;color:var(--ink-3);white-space:nowrap}
.pend{color:var(--warn);font-weight:700}

/* ---------- correo ---------- */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{border:1px solid var(--line-2);background:var(--surface);border-radius:11px;padding:8px 12px;font-family:var(--sans);font-weight:600;font-size:12.5px;
  color:var(--ink-2);cursor:pointer;display:inline-flex;gap:7px;align-items:center;box-shadow:var(--sh-1);transition:all .15s}
.seg button b{min-width:20px;padding:0 6px;border-radius:99px;background:var(--surface-3);font-size:11px;line-height:18px;text-align:center}
.seg button.on{background:var(--teal-dark);border-color:var(--teal-dark);color:#fff}
.seg button.on b{background:rgba(255,255,255,.2);color:#fff}
.seg button.alerta b{background:var(--bad);color:#fff}
.mail{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:var(--sh-1);transition:box-shadow .15s}
.mail:hover{box-shadow:var(--sh-2)}
.mail-head{padding:13px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;cursor:pointer}
.mail-head:hover{background:var(--surface-2)}
.mail-head .bola{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--teal-wash);color:var(--teal)}
.mail-head .bola.area{background:var(--ok-wash);color:var(--ok)}.mail-head .bola.usuario{background:var(--star-wash);color:var(--star)}
.mail-head .bola.rebote{background:var(--bad-wash);color:var(--bad)}.mail-head .bola.otro{background:var(--surface-3);color:var(--ink-3)}
.mail-head .bola.pqrs{background:#FFF8CC;color:#8A6D00}
.mail-head b{font-size:13px;display:block;margin-bottom:2px;word-break:break-word}
.mail-head span{font-size:12px;color:var(--ink-2);display:block;word-break:break-word}
.mail-head em{font-style:normal;font-size:11px;color:var(--ink-3);white-space:nowrap}
.mail-cuerpo{padding:2px 16px 16px;border-top:1px solid var(--line)}
.mail-texto{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:12.5px;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto;margin:13px 0}
.claves{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.clave{background:#FFF6C2;color:#7A6000;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px}
.clave.cod{background:var(--teal-wash);color:var(--teal-dark);font-family:var(--mono)}

/* ---------- detalle ---------- */
.det-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
.det-head .cod{font-family:var(--mono);font-size:clamp(19px,2vw,25px);font-weight:700;color:var(--teal-dark);word-break:break-all}
.det-head .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.det-cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
.det-lado{min-width:0}
.det-lado.fijo{position:sticky;top:84px}   /* acompaña al texto largo mientras se lee */
.bloque.plegable.cerrado{max-height:190px;overflow:hidden;position:relative}
.bloque.plegable.cerrado::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(transparent,var(--surface-2))}
.ver-mas{border:0;background:transparent;color:var(--teal);font:700 12px var(--sans);padding:6px 0;cursor:pointer}
.ficha span:last-child{overflow-wrap:anywhere}
.ficha div{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--surface-3);font-size:12.5px}
.ficha div:last-child{border-bottom:0}
.ficha span:first-child{color:var(--ink-3);min-width:min(45%,150px);flex:none}
.ficha span:last-child{font-weight:600;word-break:break-word;min-width:0}
.ficha .alerta{color:var(--warn)}
.bloque{background:var(--surface-2);border-left:3px solid var(--line-2);border-radius:0 10px 10px 0;padding:11px 13px;font-size:12.5px;white-space:pre-wrap;word-break:break-word;margin-top:7px}
.bloque.area{border-left-color:var(--t-reclamo)}.bloque.rta{border-left-color:var(--teal)}
.panel{background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:13px;min-width:0}
.panel h4{margin:0 0 4px;font-size:13.5px;display:flex;align-items:center;gap:7px}
.panel h4 .ic{color:var(--teal)}
.panel p.d{margin:0 0 12px;font-size:12px;color:var(--ink-2)}
.traza{display:grid;max-height:340px;overflow:auto}
.traza div{padding:8px 0 8px 16px;border-left:2px solid var(--line-2);position:relative;font-size:12px}
.traza div::before{content:"";position:absolute;left:-6px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--teal);border:2px solid var(--surface-2)}
.traza b{display:block;font-size:12px}.traza em{font-style:normal;color:var(--ink-3);font-size:11px}
.traza p{margin:3px 0 0;color:var(--ink-2);word-break:break-word}

/* ---------- TABLERO ---------- */
.bi-slicers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:10px;margin-bottom:16px;padding:13px 15px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);align-items:end}
.bi-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:14px}
.bi-kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh-2);min-width:0;
  display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden}
.bi-kpi::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--k,var(--teal));opacity:.85}
.bi-kpi .et{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.bi-kpi .n{font-family:var(--display);font-size:clamp(24px,2.4vw,33px);line-height:1.05;color:var(--k,var(--teal-dark))}
.bi-kpi .pie{font-size:11px;color:var(--ink-3)}
.bi-kpi.ok{--k:var(--ok)}.bi-kpi.warn{--k:var(--warn)}.bi-kpi.bad{--k:var(--bad)}.bi-kpi.teal{--k:var(--teal)}
.bi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.bi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px 11px;box-shadow:var(--sh-2);min-width:0;display:flex;flex-direction:column}
.bi-card.ancha{grid-column:span 2}
.bi-card h3{font-size:13px;margin:0 0 1px}
.bi-card .d{font-size:11px;color:var(--ink-3);margin:0 0 10px}
.bi-lienzo{position:relative;width:100%;height:clamp(200px,24vh,260px);min-width:0}
.bi-lienzo canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.bi-vacio{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-3);font-size:12px}
table.tb{width:100%;border-collapse:collapse;font-size:12px}
table.tb th{text-align:left;padding:8px 10px;color:var(--ink-3);font-size:10px;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--line);white-space:nowrap}
table.tb td{padding:9px 10px;border-bottom:1px solid var(--surface-3);white-space:nowrap}
table.tb td.dos-l{white-space:normal;min-width:170px;line-height:1.3}
table.tb td.dos-l small{display:block;color:var(--ink-3);font-size:11px}
table.tb tr[data-cod]{cursor:pointer;transition:background .12s}
table.tb tr[data-cod]:hover td{background:var(--surface-2)}
table.tb tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mono{font-family:var(--mono);font-weight:700;color:var(--teal-dark)}

/* ---------- RESPONSABLES ---------- */
.resp-barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.resp-barra .buscar{flex:1;min-width:200px;max-width:380px}
.resp-cont{font-size:12px;color:var(--ink-3)}
.resp-tabla{border:1px solid var(--line);border-radius:13px;overflow:hidden}
.resp-fila{display:grid;grid-template-columns:22px minmax(0,1.25fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.6fr) minmax(0,.85fr) 36px;
  gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--surface-3);background:var(--surface)}
.resp-fila:last-child{border-bottom:0}
.resp-fila:hover{background:var(--surface-2)}
.resp-fila.cab{background:var(--surface-2);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:9px 10px}
.resp-fila.nuevo{background:var(--teal-wash-2)}
.resp-fila label{margin:0}
.resp-fila label span{display:none}
.resp-fila input{padding:7px 9px;font-size:12.5px;border-color:transparent;background:transparent;border-radius:8px}
.resp-fila input:hover{border-color:var(--line-2);background:var(--surface)}
.resp-fila input:focus{background:var(--surface)}
.resp-fila input.falta{background:var(--warn-wash);border-color:#F0D9A6}
.estado-c{width:9px;height:9px;border-radius:50%;background:var(--ok);justify-self:center}
.estado-c.no{background:var(--amarillo);box-shadow:0 0 0 3px rgba(254,220,0,.25)}
.mapeo{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--surface-3)}
.mapeo .q{font-size:12px;overflow:hidden;text-overflow:ellipsis}
.mapeo .fl{color:var(--ink-3);text-align:center}

/* ---------- adaptación a pantallas ---------- */
@media(max-width:1380px){
  .acciones-hoy{grid-template-columns:repeat(3,minmax(0,1fr))}
  .meses{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:1150px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .inicio-cols{grid-template-columns:minmax(0,1fr)}
  .bi-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bi-slicers{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filtros{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filtros .buscar{grid-column:1/-1}
}
@media(max-width:900px){
  .det-cols{grid-template-columns:minmax(0,1fr)}
  .det-lado.fijo{position:static}
  .fila{grid-template-columns:minmax(0,1fr);gap:7px}
  .fila .der{justify-items:start;text-align:left;grid-auto-flow:column;justify-content:start;align-items:center;gap:10px}
  .mapeo{grid-template-columns:minmax(0,1fr);gap:4px}.mapeo .fl{display:none}
  .meses{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bi-card.ancha{grid-column:auto}
  .bi-grid{grid-template-columns:minmax(0,1fr)}
  .dos{grid-template-columns:minmax(0,1fr)}
  .resp-tabla{border:0;overflow:visible;display:grid;gap:10px}
  .resp-fila.cab{display:none}
  .resp-fila{grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:13px;padding:12px;box-shadow:var(--sh-1);position:relative;gap:9px 10px}
  .resp-fila .estado-c{position:absolute;top:14px;right:52px}
  .resp-fila label{grid-column:span 1}
  .resp-fila label.ancho{grid-column:1/-1}
  .resp-fila label span{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:3px}
  .resp-fila input{border-color:var(--line-2);background:var(--surface)}
  .resp-fila .icono{position:absolute;top:6px;right:6px}
}
@media(max-width:640px){
  .acciones-hoy{grid-template-columns:repeat(2,minmax(0,1fr))}
  .meses{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-kpis{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .kmini{padding:11px}
  .m-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .correo-res{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bh{grid-template-columns:minmax(0,105px) minmax(0,1fr) 30px}
  .quien{display:none}
  .marca small{display:none}
  .filtros,.bi-slicers{grid-template-columns:minmax(0,1fr)}
  .modal-cab,.modal-cuerpo{padding-left:16px;padding-right:16px}
  .bi-lienzo{height:220px}
  .etapas{width:100%}
}

/* ---------- CONVERSACIONES DE CORREO ---------- */
button.mail{display:block;width:100%;text-align:left;font-family:var(--sans);color:inherit;padding:0;cursor:pointer}
.mail-head .extracto{color:var(--ink-3);font-size:11.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail-head .bola.cita,.hilo-cab .bola.cita{background:#E6F4EC;color:var(--verde)}
.mail-head .bola.curso,.hilo-cab .bola.curso{background:var(--teal-wash);color:var(--teal-dark)}
.clave.est{background:var(--teal-wash);color:var(--teal-dark)}
.clave.nuevo{background:var(--rojo);color:#fff}
.clave.gris{background:var(--surface-3);color:var(--ink-2)}
.hilo-cab{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
.hilo-cab .bola{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#FFF8CC;color:#8A6D00}
.hilo-cab h3{font-size:clamp(16px,1.4vw,19px);word-break:break-word}
.hilo-acc{display:flex;gap:7px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
a.b{text-decoration:none;border-radius:9px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;padding:6px 11px}
a.b.sec{background:var(--surface);color:var(--teal-dark);border:1px solid var(--line-2)}
.b{white-space:nowrap}
.hilo-acc > *{flex:none}
.hilo-cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.mensajes{display:grid;gap:10px;max-height:78vh;overflow:auto;padding-right:4px}
.msg{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);box-shadow:var(--sh-1);border-left:4px solid var(--teal)}
.msg.area{border-left-color:var(--verde);background:#FAFDFB}
.msg.siau{border-left-color:var(--t-reclamo);background:#FFFCF3}
.msg.rebote{border-left-color:var(--rojo)}
.msg-cab{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:8px}
.msg-cab .avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--teal-wash);color:var(--teal-dark);font-weight:800;font-family:var(--display)}
.msg.area .avatar{background:#E6F4EC;color:var(--verde)}.msg.siau .avatar{background:#FBF1D2;color:#8A6400}
.msg-cab b{font-size:13px;display:block}.msg-cab span{font-size:11.5px;color:var(--ink-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-cab em{font-style:normal;font-size:11px;color:var(--ink-3);white-space:nowrap}
.msg-texto{font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto}
.adjuntos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px;margin-top:10px}
.adj{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:7px 8px;background:var(--surface-2)}
.adj-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface);color:var(--teal)}
.adj b{font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.adj em{font-style:normal;font-size:10.5px;color:var(--ink-3)}
.adj .b.mini{padding:4px 7px}
.tabs-acc{display:flex;gap:4px;padding:4px;background:var(--surface-3);border-radius:12px;margin-bottom:10px;flex-wrap:wrap}
.tabs-acc button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 8px;font-family:var(--sans);font-weight:600;font-size:12.5px;color:var(--ink-2);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tabs-acc button.on{background:var(--surface);color:var(--teal-dark);box-shadow:var(--sh-1)}
.detectado{display:inline-flex;align-items:center;gap:3px;margin-left:4px;font-size:10px;font-weight:700;color:var(--ok);background:var(--ok-wash);padding:1px 6px;border-radius:99px;vertical-align:1px}
.detectado .ic{width:11px;height:11px}
label.chk{display:flex;gap:8px;align-items:flex-start;font-weight:500;color:var(--ink-2);font-size:12.5px;margin:8px 0 0;cursor:pointer}
label.chk input{width:auto;margin-top:2px;accent-color:var(--teal)}
.lista-chk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.modos{display:grid;gap:8px;margin:12px 0 4px}
.modo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;cursor:pointer;margin:0;background:var(--surface)}
.modo:has(input:checked){border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,96,129,.12)}
.modo input{width:auto;margin-top:3px;accent-color:var(--teal)}
.modo b{display:block;font-size:13px;color:var(--ink)}.modo span{font-size:11.5px;color:var(--ink-3);font-weight:400}
.adj-sel{margin-top:12px}
.adj-lista{display:grid;gap:4px;max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--surface)}
.adj-chk{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:7px;align-items:center;margin:0;font-weight:500;font-size:12px;color:var(--ink-2);cursor:pointer}
.adj-chk input{width:auto;accent-color:var(--teal)}.adj-chk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.adj-chk em{font-style:normal;font-size:10.5px;color:var(--ink-3)}
.subir{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:7px 11px;border:1px dashed var(--line-2);border-radius:10px;cursor:pointer;color:var(--teal-dark);font-weight:600;font-size:12px;background:var(--surface)}
.subir:hover{border-color:var(--teal);background:var(--teal-wash-2)}
.subir input{display:none}
