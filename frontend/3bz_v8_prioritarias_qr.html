<script>
/* =====================================================================================
   v8 · PRIORITARIAS, RIESGO, DIRECCIONAMIENTO SUGERIDO, REDACCIÓN, QR Y CELEBRACIONES
   ===================================================================================== */
var NIVEL_INFO = {
  "Vital NNA":  { t:"Riesgo vital · menor de edad", h:8,  c:"vnna", norma:"Circular Supersalud 2026151000000007-5" },
  "Vital":      { t:"Riesgo vital", h:24, c:"vital", norma:"Circular Supersalud 2023151000000010-5" },
  "Priorizado": { t:"Priorizada", h:48, c:"prz", norma:"Circular Supersalud 2023151000000010-5" },
  "Tutela":     { t:"Tutela", h:0, c:"tutela", norma:"Decreto 2591 de 1991" },
  "Simple":     { t:"Riesgo simple", h:72, c:"simple", norma:"Circular Supersalud 2023151000000010-5" }
};
function nivelTag(n){
  var i = NIVEL_INFO[n]; if(!i) return n ? '<span class="prio Alta">'+esc(n)+'</span>' : '';
  return '<span class="nivel '+i.c+'">'+ic(/vital/i.test(n)?"escudo":"alerta","s")+esc(i.t)+(i.h?' · '+i.h+' h':'')+'</span>';
}
function marcarPrioNav(items){
  var urgentes = (items||[]).filter(function(x){ return /vital|priorizado/i.test(x.nivel) || x.prioridad==="Crítica"; }).length;
  var b = $("navPrio"); if(!b) return;
  b.hidden = !(items && items.length); b.textContent = items ? items.length : 0;
  b.classList.toggle("latido", urgentes > 0);
}

/* Tiempo restante legible: «3 h 20 min», «vencida hace 2 h». */
function restante(ms){
  if(ms === null || ms === undefined || isNaN(ms)) return "";
  var neg = ms < 0, m = Math.round(Math.abs(ms)/60000), d = Math.floor(m/1440), h = Math.floor((m%1440)/60), mi = m%60;
  var t = d ? d+" d "+h+" h" : (h ? h+" h "+("0"+mi).slice(-2)+" min" : mi+" min");
  return neg ? "vencida hace "+t : "quedan "+t;
}
var RELOJ_PRIO = null;
function cargarPrioritarias(){
  $("prioLista").innerHTML = esqueleto(4);
  srv("apiPrioritarias").then(pintarPrioritarias).catch(function(e){ aviso("prioAviso", msgErr(e), "err"); });
}
function pintarPrioritarias(r){
  if(!r || !r.items){ $("prioLista").innerHTML = vacio("escudo","Sin datos."); return; }
  APP.prio = r; marcarPrioNav(r.items);
  var cuenta = function(f){ return r.items.filter(f).length; };
  var tarjeta = function(n, t, clase){ return '<div class="pr-k '+clase+'"><b data-n="'+n+'">'+n+'</b><span>'+t+'</span></div>'; };
  $("prioResumen").innerHTML =
    tarjeta(cuenta(function(x){ return x.nivel==="Vital NNA"; }), "Riesgo vital en menores · 8 h", "vnna")+
    tarjeta(cuenta(function(x){ return x.nivel==="Vital"; }), "Riesgo vital · 24 h", "vital")+
    tarjeta(cuenta(function(x){ return x.nivel==="Priorizado"; }), "Priorizadas · 48 h", "prz")+
    tarjeta(cuenta(function(x){ return !/vital|priorizado/i.test(x.nivel); }), "Tutelas, peticiones y entes", "otras")+
    tarjeta(cuenta(function(x){ return x.vencida; }), "Fuera de término", "venc");
  animarNumeros($("prioResumen"));
  if(!r.items.length){ $("prioLista").innerHTML = '<div class="aviso ok">'+ic("check","s")+'<div>No hay PQRS prioritarias abiertas. Pulsa «Identificar prioritarias» para revisar de nuevo todas las abiertas con las circulares vigentes.</div></div>'; return; }
  $("prioLista").innerHTML = '<div class="prio-lista anim-lista">'+r.items.map(function(x){
    var i = NIVEL_INFO[x.nivel] || { c:"otras" };
    return '<button class="pr-card '+i.c+(x.vencida?" vencida":"")+'" type="button" data-cod="'+esc(x.codigo)+'" data-limite="'+(x.limite||"")+'">'+
      '<div class="pr-cab"><span class="mono">'+esc(x.codigo)+'</span>'+(NIVEL_INFO[x.nivel] ? nivelTag(x.nivel) : '<span class="prio '+esc(x.prioridad)+'">'+esc(x.clasificacion||x.prioridad)+'</span>')+'</div>'+
      '<div class="pr-reloj">'+ic("reloj","s")+'<b class="cuenta">'+esc(restante(x.limite ? x.limite - Date.now() : null))+'</b><em>'+(x.limiteTexto ? "límite "+esc(x.limiteTexto) : "")+'</em></div>'+
      '<div class="pr-med">'+tipoTag(x.tipo)+(x.sede?'<span>'+esc(x.sede)+'</span>':'')+(x.servicio?'<span>'+esc(x.servicio)+'</span>':'')+(x.remitente?'<span class="ent">'+esc(x.remitente)+'</span>':'')+'</div>'+
      ((x.poblacion||[]).length ? '<div class="pr-pob">'+x.poblacion.map(function(p){ return '<span>'+esc(p)+'</span>'; }).join("")+'</div>' : '')+
      ((x.razones||[]).length ? '<div class="pr-raz">'+esc(x.razones.join(" · "))+'</div>' : '')+
      '<div class="pr-pie"><span class="'+(x.conArea?"ok":"pend")+'">'+(x.conArea ? "En el área: "+esc(String(x.responsable||"").split(" · ")[0]) : "Sin direccionar")+'</span><span>'+ic("flecha","s")+'</span></div>'+
    '</button>';
  }).join("")+'</div>';
  $("prioLista").querySelectorAll("[data-cod]").forEach(function(b){ b.addEventListener("click", function(){ abrirDetalle(b.dataset.cod); }); });
  if(RELOJ_PRIO) clearInterval(RELOJ_PRIO);
  RELOJ_PRIO = setInterval(function(){
    if($("v-prioritarias").hidden){ clearInterval(RELOJ_PRIO); RELOJ_PRIO = null; return; }
    $("prioLista").querySelectorAll("[data-limite]").forEach(function(b){
      var l = parseInt(b.dataset.limite,10); if(!l) return;
      b.querySelector(".cuenta").textContent = restante(l - Date.now());
      b.classList.toggle("vencida", l < Date.now());
    });
  }, 30000);
}
$("btnIdentificar").addEventListener("click", function(){
  var fin = ocupado("btnIdentificar", "Revisando todas las abiertas…");
  srv("apiIdentificarPrioritarias").then(function(r){
    fin();
    aviso("prioAviso", esc(r.mensaje) + (r.nuevas && r.nuevas.length ? "<br>"+r.nuevas.map(function(x){ return "<b>"+esc(x.codigo)+"</b> · "+esc(x.nivel)+" ("+esc((x.razones||[]).slice(0,3).join(", "))+")"; }).join("<br>") : ""), r.nuevas && r.nuevas.length ? "err" : "ok");
    if(r.nuevas && r.nuevas.length){ sonar(r.nuevas.some(function(x){ return /vital/i.test(x.nivel); }) ? "Vital" : "Crítica"); }
    pintarPrioritarias({ items: r.prioritarias });
  }).catch(function(e){ fin(); aviso("prioAviso", msgErr(e), "err"); });
});

/* ---------------- detalle: banda de riesgo, áreas sugeridas y redacción ---------------- */
function sugerenciasArea(sug){
  if(!sug || !sug.length) return '';
  return '<div class="sug-areas"><span class="et">'+ic("area","s")+'Sugerido por el directorio</span>'+sug.map(function(x, i){
    return '<button type="button" class="sa'+(i===0?" on":"")+'" data-area="'+esc(x.id)+'" title="'+esc((x.razones||[]).join(", "))+'">'+esc(x.area)+
      '<small>'+esc((x.razones||[]).slice(0,2).join(" · "))+'</small></button>'; }).join("")+'</div>';
}
function bandaRiesgo(d, puede, cerrada){
  var n = d.nivelRiesgo, i = NIVEL_INFO[n];
  if(d.esFelicitacion) return '<div class="banda-feliz">'+ic("estrella","s")+'<div style="flex:1"><b>Felicitación.</b> El usuario recibió el agradecimiento automático. Solo falta que el área la conozca; no requiere respuesta ni seguimiento.</div></div>';
  var ajuste = puede.radicar && !cerrada
    ? '<div class="riesgo-ajuste"><select id="selRiesgo"><option value="auto">Calcular de nuevo (automático)</option>'+
      ["Vital NNA","Vital","Priorizado"].map(function(k){ return '<option value="'+k+'"'+(k===n?" selected":"")+'>'+esc(NIVEL_INFO[k].t)+' · '+NIVEL_INFO[k].h+' h</option>'; }).join("")+
      '<option value=""'+(!n||!i||!/vital|priorizado/i.test(n)?" selected":"")+'>Sin riesgo especial (término normal)</option></select>'+
      '<input id="motivoRiesgo" placeholder="Motivo del ajuste (opcional)"><button class="b sec mini" type="button" id="btnRiesgo">Aplicar</button></div>' : '';
  if(!i || !/vital|priorizado/i.test(n))
    return puede.radicar && !cerrada ? '<details class="riesgo-mini"><summary>'+ic("escudo","s")+'Nivel de riesgo: sin riesgo especial · ajustar</summary>'+ajuste+'</details>' : '';
  return '<div class="banda-riesgo '+i.c+'">'+
    '<div class="br-ic">'+ic("escudo")+'</div>'+
    '<div class="br-tx"><b>'+esc(i.t)+' · responder en '+i.h+' horas</b>'+
      '<span>'+esc(d.terminoTexto||i.norma)+(d.limiteHoras ? ' · límite <b>'+esc(d.limiteHoras)+'</b>' : '')+'</span>'+
      ((d.poblacionPriorizada||[]).length ? '<div class="pr-pob">'+d.poblacionPriorizada.map(function(p){ return '<span>'+esc(p)+'</span>'; }).join("")+'</div>' : '')+
      (d.riesgoRazones ? '<em>Señales: '+esc(d.riesgoRazones)+(d.riesgoManual ? ' · ajustado a mano' : '')+'</em>' : (d.riesgoManual ? '<em>Ajustado a mano</em>' : ''))+
    '</div>'+ajuste+'</div>';
}
function activarDetalleV8(d){
  document.querySelectorAll("#detalleCuerpo .sa[data-area]").forEach(function(b){
    b.addEventListener("click", function(){
      if($("selArea")) $("selArea").value = b.dataset.area;
      document.querySelectorAll("#detalleCuerpo .sa").forEach(function(x){ x.classList.toggle("on", x===b); });
    });
  });
  if($("btnRiesgo")) $("btnRiesgo").addEventListener("click", function(){
    var fin = ocupado(this, "Aplicando…");
    srv("apiFijarRiesgo", d.codigo, $("selRiesgo").value, $("motivoRiesgo").value).then(trasGestion(fin, "Nivel de riesgo actualizado.")).catch(fallo(fin));
  });
  if($("btnRedactar")) $("btnRedactar").addEventListener("click", function(){
    var borrador = $("txtRtaUsuario").value.trim() || (APP.detalle.respuestaArea || "");
    var fin = ocupado(this, "Redactando…");
    srv("apiRedactarRespuesta", d.codigo, borrador).then(function(r){
      fin();
      if(!r.ok){ aviso("detAviso", esc(r.mensaje), "err"); return; }
      $("txtRtaUsuario").value = r.texto; $("txtRtaUsuario").classList.add("destello");
      setTimeout(function(){ $("txtRtaUsuario").classList.remove("destello"); }, 900);
      aviso("detAviso", "Respuesta redactada a partir de la gestión del área. Revísala y ajústala antes de enviarla.", "ok");
    }).catch(fallo(fin));
  });
  if(d.nivelRiesgo && /vital/i.test(d.nivelRiesgo) && !/cerrada/i.test(d.estado)) alarmaVisual(true);
}

/* ---------------- radicar: riesgo y área sugerida mientras se escribe ---------------- */
(function(){
  var t = null;
  function evaluar(){
    if(!$("radRiesgo")) return;
    var d = { descripcion:val("r_descripcion"), tipoPqrs:val("r_tipoPqrs"), edad:val("r_edad"), tipoDocSolicitante:val("r_tipoDocSolicitante"),
              tipoDocAfiliado:val("r_tipoDocAfiliado"), poblacion:val("r_poblacion"), servicio:val("r_servicio"), sede:val("r_sede") };
    if(d.descripcion.length < 25 || /felicit/i.test(d.tipoPqrs)){ $("radRiesgo").innerHTML = ""; return; }
    srvSilencioso("apiEvaluarRiesgo", d).then(function(r){
      if(!r) return;
      var h = "";
      if(r.nivel && NIVEL_INFO[r.nivel] && /vital|priorizado/i.test(r.nivel)){
        var i = NIVEL_INFO[r.nivel];
        h += '<div class="banda-riesgo '+i.c+' compacta"><div class="br-ic">'+ic("escudo")+'</div><div class="br-tx"><b>Se radicará como '+esc(i.t)+' · '+i.h+' horas</b>'+
          '<span>'+esc(r.norma||"")+'</span>'+(r.poblacion.length?'<div class="pr-pob">'+r.poblacion.map(function(p){ return '<span>'+esc(p)+'</span>'; }).join("")+'</div>':'')+
          '<em>Señales: '+esc(r.razones.join(", "))+'. Al radicar se avisa de inmediato al SIAU.</em></div></div>';
      }
      if(r.areas && r.areas.length) h += '<div class="sug-areas"><span class="et">'+ic("area","s")+'Área sugerida</span>'+r.areas.map(function(a){ return '<span class="sa">'+esc(a.area)+'<small>'+esc((a.razones||[]).slice(0,2).join(" · "))+'</small></span>'; }).join("")+'</div>';
      $("radRiesgo").innerHTML = h;
    }).catch(function(){});
  }
  ["r_descripcion","r_edad"].forEach(function(id){ $(id).addEventListener("input", function(){ clearTimeout(t); t = setTimeout(evaluar, 1000); }); });
  ["r_tipoPqrs","r_poblacion","r_servicio","r_sede","r_tipoDocSolicitante","r_tipoDocAfiliado"].forEach(function(id){ $(id).addEventListener("change", function(){ clearTimeout(t); t = setTimeout(evaluar, 300); }); });
})();

/* ---------------- QR del formulario, afiche e instalación ---------------- */
function qrSvg(texto, tam){
  if(!window.qrcode || !texto) return "";
  var q = qrcode(0, "M"); q.addData(texto); q.make();
  var n = q.getModuleCount(), m = 2, c = tam / (n + m*2), p = [];
  for(var y=0;y<n;y++) for(var x=0;x<n;x++) if(q.isDark(y,x)) p.push("M"+((x+m)*c).toFixed(2)+" "+((y+m)*c).toFixed(2)+"h"+c.toFixed(2)+"v"+c.toFixed(2)+"h-"+c.toFixed(2)+"z");
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+tam+' '+tam+'" width="'+tam+'" height="'+tam+'" role="img" aria-label="Código QR">'+
    '<rect width="100%" height="100%" fill="#fff"/><path fill="#00475F" d="'+p.join("")+'"/></svg>';
}
function qrActual(){ return val("qrTexto") || (APP.qr && (APP.qr.corto || APP.qr.url)) || ""; }
function pintarQR(){
  var t = qrActual();
  $("qrImagen").innerHTML = t ? qrSvg(t, 220) : '<div class="vacio">'+ic("qr")+'<div>Sin enlace del formulario</div></div>';
  $("qrUrl").textContent = t || "";
}
function cargarQR(){
  if(!$("qrImagen")) return;
  srvSilencioso("apiFormularioQR").then(function(r){
    APP.qr = r || {};
    if(r && (r.corto || r.url) && !val("qrTexto")) $("qrTexto").value = r.corto || r.url;
    if(r && r.mensaje) aviso("qrAviso", esc(r.mensaje), "info");
    pintarQR();
  }).catch(function(e){ aviso("qrAviso", msgErr(e), "err"); pintarQR(); });
}
$("qrTexto").addEventListener("input", function(){ clearTimeout(APP.tQr); APP.tQr = setTimeout(pintarQR, 300); });
$("btnQrCopiar").addEventListener("click", function(){ if(qrActual()) copiarTexto(qrActual(), "Enlace del formulario copiado"); });
$("btnQrPng").addEventListener("click", function(){
  var t = qrActual(); if(!t){ aviso("qrAviso","Primero escribe o crea el enlace del formulario.","err"); return; }
  var img = new Image(), svg = qrSvg(t, 1000);
  img.onload = function(){
    var cv = document.createElement("canvas"); cv.width = cv.height = 1000;
    cv.getContext("2d").drawImage(img, 0, 0, 1000, 1000);
    var a = document.createElement("a"); a.href = cv.toDataURL("image/png"); a.download = "QR_PQRS_MiRed_IPS.png"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
});

    '.hoja{width:210mm;height:296mm;box-sizing:border-box;padding:16mm 16mm 12mm;display:flex;flex-direction:column;background:#fff;position:relative;overflow:hidden}'+

    '.logo{height:26mm}h1{font-family:"Barlow Semi Condensed";font-weight:900;font-size:40pt;line-height:1;margin:10mm 0 4mm;color:#00475F}'+
    'p.sub{font-size:16pt;margin:0 0 8mm;color:#465C68}.centro{display:flex;gap:10mm;align-items:center;flex:1}'+
    '.qr{border:3px solid #006081;border-radius:8mm;padding:6mm;background:#fff}.qr svg{width:92mm;height:92mm;display:block}'+
    '.mascota{height:120mm}.tipos{display:flex;flex-wrap:wrap;gap:3mm;margin:6mm 0}.tipos span{font-weight:700;font-size:12pt;padding:2mm 4mm;border-radius:3mm;color:#fff}'+
    '.url{font-family:Consolas,monospace;font-size:12pt;color:#00475F;margin-top:3mm;word-break:break-all}.pasos{font-size:13pt;line-height:1.5;margin:0;padding-left:6mm}'+
    '.pie{font-size:9pt;color:#7F939E;border-top:1px solid #E1E8EC;padding-top:3mm;line-height:1.4}.imprimir{position:fixed;top:10px;right:10px;padding:10px 16px;font:700 14px Barlow;background:#006081;color:#fff;border:0;border-radius:10px;cursor:pointer}'+

    (logo ? '<img class="logo" src="'+logo+'" alt="MiRed IPS">' : '')+

    '<div class="centro"><div><div class="qr">'+qrSvg(t, 400)+'</div><div class="url">'+esc(t)+'</div>'+
      '<div class="tipos"><span style="background:#8455B8">Felicitaciones</span><span style="background:#E20A31">Quejas</span><span style="background:#B98A00">Reclamos</span><span style="background:#006D93">Peticiones</span><span style="background:#00985A">Sugerencias</span></div>'+
      '<ol class="pasos"><li>Abra la cámara y apunte al código.</li><li>Escriba su mensaje y su correo.</li><li>Reciba su número de radicado y la fecha de respuesta.</li></ol></div>'+
      (window.IMG_MASCOTA ? '<img class="mascota" src="'+IMG_MASCOTA+'" alt="SIAU MiRed IPS">' : '')+'</div>'+
    '<div class="pie"><b>Oficina de Atención al Usuario (SIAU) · MiRed Barranquilla IPS S.A.S.</b><br>Si su situación pone en riesgo su vida o la de un menor de edad, además del formulario acérquese de inmediato al personal de la sede. '+
    'Sus datos se tratan conforme a la Ley 1581 de 2012 solo para gestionar su solicitud.</div></div></body></html>');
  w.document.close();
});

/* ---------------- celebraciones y alarma visual ---------------- */
function celebrar(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var capa = document.createElement("div"); capa.className = "confeti";
  var colores = ["#8455B8","#E20A31","#FEDC00","#009C4D","#006081","#0F7FA6"];
  for(var i=0;i<70;i++){
    var p = document.createElement("i");
    p.style.left = (Math.random()*100)+"%"; p.style.background = colores[i % colores.length];
    p.style.animationDelay = (Math.random()*0.5)+"s"; p.style.animationDuration = (1.8+Math.random()*1.4)+"s";
    p.style.transform = "rotate("+(Math.random()*360)+"deg)"; p.style.width = (6+Math.random()*6)+"px"; p.style.height = (8+Math.random()*8)+"px";
    capa.appendChild(p);
  }
  if(window.IMG_MASCOTA){ var m = document.createElement("img"); m.src = IMG_MASCOTA; m.className = "confeti-mascota"; m.alt = ""; capa.appendChild(m); }
  document.body.appendChild(capa);
  setTimeout(function(){ if(capa.parentNode) capa.parentNode.removeChild(capa); }, 3600);
}
function alarmaVisual(suave){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.body.classList.remove("alarma", "alarma-suave"); void document.body.offsetWidth;
  document.body.classList.add(suave ? "alarma-suave" : "alarma");
  setTimeout(function(){ document.body.classList.remove("alarma", "alarma-suave"); }, suave ? 1600 : 3200);
}
</script>
